name: Fast correctness tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install frvcpy pillow matplotlib numpy pandas
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Phase-1 and core unit tests
        run: |
          python -m unittest tests.test_phase1_correctness tests.test_repair_and_validation tests.test_charging_surrogates -q

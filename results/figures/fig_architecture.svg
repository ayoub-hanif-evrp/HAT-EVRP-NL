<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-label="HAT-EVRP-NL architecture">
  <rect width="980" height="420" fill="#f7f9fb"/>
  <text x="24" y="28" font-family="Georgia, serif" font-size="18" fill="#1a1a1a">HAT-EVRP-NL architecture</text>
  <text x="24" y="48" font-family="Segoe UI, sans-serif" font-size="11" fill="#555">Shared causal visit-history Transformer ’ state fusion ’ DeepSets ’ hierarchical decoder ’ frvcpy ’ Python validation</text>

  <rect x="24" y="72" width="140" height="70" rx="6" fill="#e8eef5" stroke="#4a6278"/>
  <text x="94" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Static node</text>
  <text x="94" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">encoder</text>

  <rect x="190" y="72" width="170" height="70" rx="6" fill="#d9e8f7" stroke="#2b6cb0"/>
  <text x="275" y="96" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Shared causal</text>
  <text x="275" y="114" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Transformer (per EV)</text>
  <text x="275" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#444">visit history tokens</text>

  <rect x="390" y="72" width="150" height="70" rx="6" fill="#d9e8f7" stroke="#2b6cb0"/>
  <text x="465" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Dynamic state</text>
  <text x="465" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">fusion</text>

  <rect x="570" y="72" width="150" height="70" rx="6" fill="#cfe3f5" stroke="#1a5276"/>
  <text x="645" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">DeepSets fleet</text>
  <text x="645" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">aggregation</text>
  <text x="645" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#444">g=Á(£ Æ(v_i))</text>

  <rect x="750" y="72" width="200" height="70" rx="6" fill="#bdddff" stroke="#0d47a1"/>
  <text x="850" y="96" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Hierarchical decoder</text>
  <text x="850" y="114" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">route / new-route</text>
  <text x="850" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">customer / close</text>

  <path d="M164 107 H190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M360 107 H390" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M540 107 H570" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M720 107 H750" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="190" width="280" height="90" rx="6" fill="#fff6e8" stroke="#b36b00"/>
  <text x="330" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Immutable customer decision order</text>
  <text x="330" y="238" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">route['customers'] = construction decisions</text>
  <text x="330" y="258" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">SOC/time features may reflect optimized plan</text>

  <rect x="510" y="190" width="280" height="90" rx="6" fill="#eef8ee" stroke="#2e7d32"/>
  <text x="650" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Mutable charging plan (frvcpy)</text>
  <text x="650" y="238" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">fixed-route nonlinear charging (FRVCP)</text>
  <text x="650" y="258" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">not a global routing optimum</text>

  <path d="M850 142 V170 H650 V190" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M650 280 V310" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="510" y="310" width="280" height="70" rx="6" fill="#f3eef8" stroke="#6a1b9a"/>
  <text x="650" y="338" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Python forward feasibility validation</text>
  <text x="650" y="358" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">check_route / check_solution (same project)</text>

  <text x="24" y="400" font-family="Segoe UI, sans-serif" font-size="10" fill="#666">Ablations: H1 state-only; H2 history; H3 DeepSets only; H4 history+DeepSets (complete architecture).</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
